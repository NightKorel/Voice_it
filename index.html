<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聲音節奏遊戲・第一關</title>
<style>
  *{ box-sizing:border-box; }
  :root{
    --bg:#12121c; --panel:#1e1e2e; --ink:#eceafd; --muted:#9a97b8;
    --up:#ff6b9d; --mid:#ffd166; --down:#5ee7df;
  }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; }
  #app{ max-width:760px; margin:0 auto; padding:14px; }
  h1{ font-size:20px; text-align:center; }
  .muted{ color:var(--muted); font-size:14px; }
  button{ font-family:inherit; cursor:pointer; border:none; border-radius:12px;
    padding:12px 18px; font-size:16px; font-weight:700; color:#12121c;
    background:linear-gradient(135deg,#c792ea,#7c6cf0); }
  button:active{ transform:translateY(1px); }
  button.big{ display:block; width:100%; margin:12px 0; padding:16px; font-size:18px; }
  .panel{ background:var(--panel); border-radius:18px; padding:20px; margin-top:12px; }
  .hidden{ display:none !important; }
  .center{ text-align:center; }
  #cal-step{ font-size:22px; font-weight:800; margin:6px 0; }
  #cal-hint{ font-size:16px; margin:10px 0; }
  .dots{ font-size:30px; min-height:36px; }
  #cal-live{ font-size:15px; color:var(--muted); min-height:22px; }
  canvas{ width:100%; display:block; border-radius:16px; background:#15151f; touch-action:none; }
  #hud{ display:flex; justify-content:space-between; font-weight:800; margin:6px 2px; font-size:15px; }
</style>
</head>
<body>
<div id="app">
  <h1>🎶 聲音節奏遊戲 <span class="muted">第一關</span></h1>

  <!-- 開場 -->
  <div id="screen-intro" class="panel center">
    <p>用你的<b>音高</b>打三排：<b style="color:var(--up)">唱高→上</b>、
       <b style="color:var(--mid)">中→中</b>、<b style="color:var(--down)">低→下</b>。<br>
       長條音符要<b>撐住那個高度</b>唱滿。</p>
    <p class="muted">先校準音域。要允許麥克風，建議用 Chrome／Edge 的正式分頁（別在預覽視窗）。</p>
    <button class="big" id="btn-begin">開始校準 🎙️</button>
  </div>

  <!-- 校準 -->
  <div id="screen-cal" class="panel center hidden">
    <div id="cal-step">校準 1／3</div>
    <div id="cal-hint"></div>
    <div class="dots" id="cal-dots"></div>
    <div id="cal-live"></div>
    <button class="big" id="btn-cal">開始唱 3 秒 ▶</button>
  </div>

  <!-- 遊戲 -->
  <div id="screen-game" class="hidden">
    <div id="hud">
      <div>分數 <span id="score">0</span></div>
      <div>連段 <span id="combo">0</span></div>
      <div><span id="progress">0%</span></div>
    </div>
    <canvas id="cv" width="760" height="300"></canvas>
    <div class="center muted" style="margin-top:8px;">跟著節拍，把你的音高（白點）移到音符那一排</div>
  </div>

  <!-- 結算 -->
  <div id="screen-end" class="panel center hidden">
    <h2 id="end-title">🎉 過關！</h2>
    <div id="end-stats" style="font-size:17px; margin:12px 0;"></div>
    <button class="big" id="btn-again">再玩一次 ↻</button>
    <button class="big" id="btn-recal2" style="background:#2c2c44;color:var(--ink);">重新校準 ↻</button>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);

/* ===== 音訊 ===== */
let ac, analyser, micStream, buf;
async function initAudio(){
  if(ac) return true;
  try{ micStream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ alert("拿不到麥克風，請允許權限並用 Chrome／Edge。"); return false; }
  ac=new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});
  const src=ac.createMediaStreamSource(micStream);
  analyser=ac.createAnalyser(); analyser.fftSize=2048;
  src.connect(analyser);
  buf=new Float32Array(analyser.fftSize);
  return true;
}

/* ===== 音高偵測（自相關） ===== */
function autoCorrelate(b, sr){
  let N=b.length, rms=0;
  for(let i=0;i<N;i++) rms+=b[i]*b[i];
  rms=Math.sqrt(rms/N);
  if(rms<0.004) return -1;
  let r1=0,r2=N-1,thr=0.2;
  for(let i=0;i<N/2;i++){ if(Math.abs(b[i])<thr){ r1=i; break; } }
  for(let i=1;i<N/2;i++){ if(Math.abs(b[N-i])<thr){ r2=N-i; break; } }
  const s=b.slice(r1,r2), M=s.length, c=new Float32Array(M);
  for(let i=0;i<M;i++){ let sum=0; for(let j=0;j<M-i;j++) sum+=s[j]*s[j+i]; c[i]=sum; }
  let d=0; while(d<M-1 && c[d]>c[d+1]) d++;
  let mv=-1,mp=-1;
  for(let i=d;i<M;i++){ if(c[i]>mv){ mv=c[i]; mp=i; } }
  if(mp<=0) return -1;
  let T=mp; const x1=c[T-1]||0,x2=c[T],x3=c[T+1]||0, a=(x1+x3-2*x2)/2, bb=(x3-x1)/2;
  if(a) T=T-bb/(2*a);
  const hz=sr/T;
  return (hz<60||hz>1200)? -1 : hz;
}

/* ===== 校準 ===== */
const cal={high:0,mid:0,low:0,boundHM:0,boundML:0};
let calStep=0;
const CAL=[
  {k:"high",label:"校準 1／3",hint:'唱幾個你覺得<b style="color:var(--up)">「高」</b>的聲音（拉長，「啊——」）'},
  {k:"mid", label:"校準 2／3",hint:'再唱幾個<b style="color:var(--mid)">「稍低」</b>的聲音'},
  {k:"low", label:"校準 3／3",hint:'最後唱幾個<b style="color:var(--down)">「更低」</b>的聲音'},
];
$("btn-begin").addEventListener("click", async()=>{
  if(!await initAudio()) return;
  if(ac.state==="suspended") await ac.resume();
  $("screen-intro").classList.add("hidden");
  $("screen-cal").classList.remove("hidden");
  calStep=0; showCal();
});
function showCal(){
  $("cal-step").textContent=CAL[calStep].label;
  $("cal-hint").innerHTML=CAL[calStep].hint;
  $("cal-dots").textContent=""; $("cal-live").textContent="";
  $("btn-cal").textContent="開始唱 3 秒 ▶"; $("btn-cal").disabled=false;
}
$("btn-cal").addEventListener("click", ()=>{
  $("btn-cal").disabled=true;
  collect(3000,(med)=>{
    cal[CAL[calStep].k]=med; calStep++;
    if(calStep<CAL.length) showCal(); else finishCal();
  });
});
function collect(ms, done){
  const samples=[], t0=performance.now(); let dot=0;
  (function tick(){
    analyser.getFloatTimeDomainData(buf);
    let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/buf.length);
    const hz=autoCorrelate(buf, ac.sampleRate);
    if(hz>0) samples.push(hz);
    const bars="▮".repeat(Math.min(20, Math.round(rms*300)));
    $("cal-live").textContent="音量 "+(bars||"（沒聲音）")+(hz>0?"　🎵 "+Math.round(hz)+" Hz":"");
    const nd=Math.floor((performance.now()-t0)/500);
    if(nd!==dot){ dot=nd; $("cal-dots").textContent="🎵".repeat(dot); }
    if(performance.now()-t0<ms) requestAnimationFrame(tick);
    else{
      if(samples.length<5){ $("cal-live").textContent="沒聽到足夠聲音，再試一次。"; $("btn-cal").disabled=false; return; }
      samples.sort((a,b)=>a-b); done(samples[Math.floor(samples.length/2)]);
    }
  })();
}
function finishCal(){
  let a=[["high",cal.high],["mid",cal.mid],["low",cal.low]].sort((x,y)=>y[1]-x[1]);
  cal.high=a[0][1]; cal.mid=a[1][1]; cal.low=a[2][1];
  cal.boundHM=Math.sqrt(cal.high*cal.mid);
  cal.boundML=Math.sqrt(cal.mid*cal.low);
  startGame();
}

/* ===== 譜面（BPM 88） ===== */
const BPM=88, beat=60/BPM, APPROACH=2.2;
function b2s(b){ return b*beat; }
// lane: 0=上(高) 1=中 2=下(低)；dur>0 為長音（秒）
const CHART=[
  {b:4,l:1},{b:5,l:0},{b:6,l:1},{b:7,l:2},
  {b:8,l:1},{b:9,l:0,dur:b2s(2)},
  {b:12,l:2},{b:13,l:1},{b:14,l:0},{b:15,l:2},
  {b:16,l:1,dur:b2s(2)},
  {b:19,l:0},{b:20,l:1},{b:21,l:2},{b:22,l:1},
  {b:23,l:0},{b:24,l:2},{b:25,l:1},
  {b:26,l:0},{b:27,l:1},{b:28,l:2,dur:b2s(2)},
].map(n=>({ t:b2s(n.b), l:n.l, dur:n.dur||0, done:false, frames:0, good:0 }));
const LAST_T=Math.max(...CHART.map(n=>n.t+n.dur));

/* ===== 節拍聲 ===== */
let schedTimer, nextBeat, beatNo, noiseBuf;
function makeNoise(){
  noiseBuf=ac.createBuffer(1, ac.sampleRate*0.2, ac.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
function kick(t){
  const o=ac.createOscillator(), g=ac.createGain();
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(50,t+0.12);
  g.gain.setValueAtTime(0.6,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.18);
}
function hat(t){
  const s=ac.createBufferSource(), g=ac.createGain(), f=ac.createBiquadFilter();
  s.buffer=noiseBuf; f.type="highpass"; f.frequency.value=7000;
  g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t+0.06);
}
function scheduler(){
  while(nextBeat < ac.currentTime+0.12){
    kick(nextBeat);
    if(beatNo%2===1) hat(nextBeat);
    nextBeat+=beat; beatNo++;
  }
}

/* ===== 遊戲 ===== */
const cv=$("cv"), ctx=cv.getContext("2d");
let songStart=0, smooth=[], stats={score:0,combo:0,maxCombo:0,hit:0,miss:0}, playing=false;
const LANE_COL=["#ff6b9d","#ffd166","#5ee7df"], LANE_NAME=["上","中","下"];

function startGame(){
  $("screen-cal").classList.add("hidden");
  $("screen-end").classList.add("hidden");
  $("screen-game").classList.remove("hidden");
  CHART.forEach(n=>{ n.done=false; n.frames=0; n.good=0; });
  stats={score:0,combo:0,maxCombo:0,hit:0,miss:0}; smooth=[];
  makeNoise();
  songStart=ac.currentTime+0.15;
  nextBeat=songStart; beatNo=0;
  clearInterval(schedTimer); schedTimer=setInterval(scheduler,25);
  playing=true;
  requestAnimationFrame(loop);
}
function laneOf(hz){
  if(hz<=0) return -1;
  return hz>=cal.boundHM?0 : hz>=cal.boundML?1 : 2;
}
function yToLane(l, h){ return h*(0.22+0.28*l); }   // 三排的 y 中心
function pitchY(hz, h){
  const top=cal.high*1.15, bot=cal.low*0.87;
  let t=(Math.log(hz)-Math.log(top))/(Math.log(bot)-Math.log(top));
  t=Math.max(0,Math.min(1,t));
  return h*(0.15+0.7*t);
}
function loop(){
  if(!playing) return;
  const W=cv.width, H=cv.height;
  analyser.getFloatTimeDomainData(buf);
  const hz=autoCorrelate(buf, ac.sampleRate);
  if(hz>0){ smooth.push(hz); if(smooth.length>5) smooth.shift(); }
  else if(smooth.length) smooth.shift();
  const sHz=smooth.length? median(smooth):-1;
  const curLane=laneOf(sHz);
  const now=ac.currentTime-songStart;

  judge(now, curLane);
  draw(now, sHz, curLane, W, H);

  $("score").textContent=stats.score;
  $("combo").textContent=stats.combo;
  $("progress").textContent=Math.max(0,Math.min(100,Math.round(now/LAST_T*100)))+"%";

  if(now>LAST_T+1.2){ endGame(); return; }
  requestAnimationFrame(loop);
}
function judge(now, curLane){
  for(const n of CHART){
    if(n.done) continue;
    if(n.dur>0){
      if(now>=n.t && now<=n.t+n.dur){ n.frames++; if(curLane===n.l) n.good++; }
      else if(now>n.t+n.dur){ n.done=true; (n.frames && n.good/n.frames>=0.5)? hit():miss(); }
    }else{
      if(Math.abs(now-n.t)<=0.24){ if(curLane===n.l){ n.done=true; hit(); } }
      else if(now>n.t+0.24){ n.done=true; miss(); }
    }
  }
}
function hit(){ stats.hit++; stats.combo++; stats.maxCombo=Math.max(stats.maxCombo,stats.combo); stats.score+=100+stats.combo*5; }
function miss(){ stats.miss++; stats.combo=0; }

function draw(now, sHz, curLane, W, H){
  ctx.clearRect(0,0,W,H);
  const judgeX=130;
  // 三排
  for(let l=0;l<3;l++){
    const y=yToLane(l,H);
    ctx.globalAlpha = curLane===l?0.30:0.12;
    ctx.fillStyle=LANE_COL[l];
    ctx.fillRect(0,y-30,W,60);
    ctx.globalAlpha=1;
    ctx.fillStyle=LANE_COL[l]; ctx.font="bold 16px sans-serif"; ctx.textBaseline="middle";
    ctx.fillText(LANE_NAME[l], 8, y);
  }
  // 判定線
  ctx.strokeStyle="#ffffff"; ctx.globalAlpha=0.7; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(judgeX,10); ctx.lineTo(judgeX,H-10); ctx.stroke(); ctx.globalAlpha=1;
  // 音符
  for(const n of CHART){
    const headX=judgeX+((n.t-now)/APPROACH)*(W-judgeX);
    const tailX=judgeX+((n.t+n.dur-now)/APPROACH)*(W-judgeX);
    if(tailX<judgeX-40 || headX>W+40) continue;
    const y=yToLane(n.l,H);
    ctx.fillStyle=LANE_COL[n.l];
    ctx.globalAlpha = n.done?0.25:1;
    if(n.dur>0){
      roundRect(headX-16, y-18, (tailX-headX)+32, 36, 14); ctx.fill();
    }else{
      ctx.beginPath(); ctx.arc(headX,y,17,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // 玩家音高：白點在判定線上
  if(sHz>0){
    const y=pitchY(sHz,H);
    ctx.fillStyle="#fff"; ctx.shadowColor="#fff"; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(judgeX,y,11,0,7); ctx.fill(); ctx.shadowBlur=0;
  }
  // 連段
  if(stats.combo>2){
    ctx.fillStyle="#fff"; ctx.globalAlpha=0.85; ctx.font="bold 30px sans-serif";
    ctx.textAlign="center"; ctx.fillText(stats.combo+" 連", W/2, 40); ctx.textAlign="left"; ctx.globalAlpha=1;
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function median(a){ const s=[...a].sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; }

function endGame(){
  playing=false; clearInterval(schedTimer);
  $("screen-game").classList.add("hidden");
  $("screen-end").classList.remove("hidden");
  const total=stats.hit+stats.miss;
  const acc=total? Math.round(stats.hit/total*100):0;
  $("end-title").textContent = acc>=60? "🎉 過關！" : "💧 再挑戰看看！";
  $("end-stats").innerHTML=`分數 <b>${stats.score}</b><br>命中 ${stats.hit}／${total}（${acc}%）<br>最高連段 ${stats.maxCombo}`;
}
$("btn-again").addEventListener("click", startGame);
$("btn-recal2").addEventListener("click", ()=>{
  $("screen-end").classList.add("hidden");
  $("screen-cal").classList.remove("hidden"); calStep=0; showCal();
});
</script>
</body>
</html>
